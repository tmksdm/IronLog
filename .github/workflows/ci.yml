name: CI

# Runs on every push to develop and on every pull request.
# Publish-only workflows (deploy.yml, build-apk.yml) stay manual and untouched.
on:
  push:
    branches: [develop]
  pull_request:

# Minimal permissions: read the repository, nothing else.
# No secrets, no Pages, no deployments, no id-token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (web)
        run: npm run build

      - name: Build (GitHub Pages)
        run: npm run build:ghpages

      # Hard gate: only shipped dependencies. This check must pass.
      - name: npm audit — production dependencies (hard gate)
        run: npm audit --omit=dev --audit-level=high

      # Informational: the full report is published and never presented as a
      # passed check. Known dev-only advisories are closed in Stage 05.
      # continue-on-error keeps the job usable while the step itself is marked
      # as failed, so the audit result is not hidden behind a green step.
      - name: npm audit — full report (informational)
        continue-on-error: true
        run: |
          npm audit --json > audit-full.json 2>/dev/null || true
          if [ ! -s audit-full.json ]; then
            echo "npm audit не вернул отчёт." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::npm audit не вернул отчёт"
            exit 1
          fi

          INFO=$(jq -r '.metadata.vulnerabilities.info // 0' audit-full.json)
          LOW=$(jq -r '.metadata.vulnerabilities.low // 0' audit-full.json)
          MODERATE=$(jq -r '.metadata.vulnerabilities.moderate // 0' audit-full.json)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' audit-full.json)
          CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' audit-full.json)
          TOTAL=$(jq -r '.metadata.vulnerabilities.total // 0' audit-full.json)

          {
            echo "## npm audit — полный отчёт (справочно)"
            echo ""
            echo "| severity | количество |"
            echo "|---|---|"
            echo "| critical | $CRITICAL |"
            echo "| high | $HIGH |"
            echo "| moderate | $MODERATE |"
            echo "| low | $LOW |"
            echo "| info | $INFO |"
            echo "| **всего** | **$TOTAL** |"
            echo ""
            echo "**Эта проверка не считается пройденной.** Жёсткий гейт для"
            echo "production-зависимостей — отдельный шаг выше. Известные"
            echo "dev-уязвимости закрываются в Stage 05 и перечисляются в"
            echo "PROJECT_STATE.md."
            echo ""
            echo "<details><summary>Затронутые пакеты</summary>"
            echo ""
            echo '```'
            jq -r '.vulnerabilities | to_entries[] | "\(.key) — \(.value.severity) — \(.value.via[0].title // .value.via[0] // "")"' audit-full.json
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TOTAL" -gt 0 ]; then
            echo "::warning::npm audit: всего $TOTAL (critical=$CRITICAL, high=$HIGH, moderate=$MODERATE). Полный отчёт — артефакт npm-audit-full."
            exit 1
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-full
          path: audit-full.json
          if-no-files-found: warn
          retention-days: 14
